# Run without installing MySQL: only for learning/testing (data disappears on restart).
spring.datasource.url=jdbc:h2:mem:sathutu;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

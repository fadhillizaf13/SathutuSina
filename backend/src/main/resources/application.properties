server.port=${PORT:8080}
spring.application.name=sathutu-sina-backend

# MySQL for normal development. Create this database first.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sathutu_sina?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Enable only behind HTTPS in deployment: server.servlet.session.cookie.secure=true

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
# Local test accounts; change credentials via environment for real users.
app.accounts.admin.email=${SS_ADMIN_EMAIL:admin@gmail.com}
app.accounts.admin.password=${SS_ADMIN_PASSWORD:qwer1234!@#$}
app.accounts.admin.name=${SS_ADMIN_NAME:Admin}
app.accounts.manager.email=${SS_MANAGER_EMAIL:manager@gmail.com}
app.accounts.manager.password=${SS_MANAGER_PASSWORD:qwer1234!@#$}
app.accounts.manager.name=${SS_MANAGER_NAME:Manager}
app.accounts.staff.email=${SS_STAFF_EMAIL:staff@gmail.com}
app.accounts.staff.password=${SS_STAFF_PASSWORD:qwer1234!@#$}
app.accounts.staff.name=${SS_STAFF_NAME:Factory Staff}

# Never put real passwords or secrets in source control; override with environment variables.
server.error.include-stacktrace=never
server.error.include-message=never
